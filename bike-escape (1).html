<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Bike Escape 3D</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--ink:#ecebe6;--dim:#ecebe699;--line:#ecebe62e;--acc:#d9a441;--bad:#d4443a;--ok:#9ccf8a;--glass:#0a0b0dbf;--cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--sans:Inter,system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-user-select:none;user-select:none}
canvas.gl{display:block;width:100%;height:100%;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 50%,#000d 105%)}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#red{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#d4443a00 40%,#d4443ad0 100%);opacity:0}
#spd{position:fixed;inset:0;pointer-events:none;opacity:0;display:none;background:repeating-conic-gradient(from 0deg,#fff0 0 2.6deg,#ffffff22 2.6deg 3deg);-webkit-mask-image:radial-gradient(circle at 50% 55%,#0000 30%,#000 88%);mask-image:radial-gradient(circle at 50% 55%,#0000 30%,#000 88%)}
#hud,#alive,#feed,#mm,#dash,#nb{display:none}
body[data-st=play] #hud,body[data-st=play] #alive,body[data-st=play] #feed,body[data-st=play] #mm,body[data-st=play] #nb,body[data-st=play] #spd{display:block}
body[data-st=play] #dash{display:flex}
/* top bar */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 24px;background:linear-gradient(#000c,#0000);pointer-events:none}
#bar{height:2px;background:var(--line);margin-bottom:10px;position:relative}
#fill{height:100%;width:0;background:var(--ink)}
#row{display:flex;justify-content:space-between;align-items:flex-start}
.cell{min-width:90px}.cell.r{text-align:right}
.cell label{display:block;font:500 10px var(--sans);letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.cell b{font:600 26px/1.1 var(--cond);letter-spacing:1px;font-variant-numeric:tabular-nums}
#cmp{position:relative;width:170px;height:24px;overflow:hidden;font:600 11px var(--cond);letter-spacing:1px;-webkit-mask-image:linear-gradient(90deg,#0000,#000 25%,#000 75%,#0000);mask-image:linear-gradient(90deg,#0000,#000 25%,#000 75%,#0000)}
#cmpt{position:absolute;left:50%;top:2px;height:18px}
#cmpt span{position:absolute;transform:translateX(-50%);color:#ecebe666}#cmpt span.c{color:var(--ink);font-size:13px}
#cmpm{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:0;height:0;border:4px solid transparent;border-bottom:6px solid var(--acc);border-top:0}
#alive{position:fixed;right:16px;top:calc(76px + env(safe-area-inset-top,0px));font:500 10px/1.5 var(--sans);letter-spacing:2px;color:var(--dim);text-align:right;text-transform:uppercase;pointer-events:none}
#alive b{display:block;font:600 22px/1 var(--cond);color:var(--ink);letter-spacing:1px}
#feed{position:fixed;right:16px;top:calc(130px + env(safe-area-inset-top,0px));width:60vw;max-width:260px;pointer-events:none;text-align:right}
#feed div{font:500 12px var(--sans);letter-spacing:.5px;padding:5px 10px;margin-top:4px;display:inline-block;background:var(--glass);border-right:2px solid var(--acc);animation:fd 3.2s forwards}
@keyframes fd{0%{opacity:0;transform:translateX(16px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#mm{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:112px;height:112px;border-radius:50%;border:1px solid var(--line);box-shadow:0 0 0 4px #0006,0 6px 24px #000a;background:#0009;pointer-events:none}
/* dashboard */
#dash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:center;width:min(42vw,260px);pointer-events:none}
#sv{font:600 68px/.9 var(--cond);letter-spacing:1px;font-variant-numeric:tabular-nums;text-shadow:0 2px 16px #000}
#su{font:500 10px var(--sans);letter-spacing:3px;color:var(--dim);margin:2px 0 10px}
#nit{display:flex;gap:4px;width:100%;margin-bottom:8px}
#nit i{flex:1;height:3px;background:var(--line)}#nit i.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
#hpw{width:100%;height:4px;background:var(--line);position:relative}
#hpf{height:100%;width:100%;background:var(--ink);transition:width .2s}
#hpt{font:500 10px var(--sans);letter-spacing:2px;color:var(--dim);margin-top:5px}
#nb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;border:1px solid var(--acc);background:var(--glass);color:var(--acc);font:600 12px var(--cond);letter-spacing:2.5px;box-shadow:0 0 20px #d9a44133;backdrop-filter:blur(6px)}
#nb:active{background:var(--acc);color:#111}
/* menus */
#msg{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:left;background:#000c;padding:28px 22px calc(26px + env(safe-area-inset-bottom,0px));font-size:14px;line-height:1.6;color:var(--dim)}
#msg.menu{align-items:stretch;justify-content:space-between;background:linear-gradient(90deg,#000d,#0000 70%),linear-gradient(#0000 55%,#000d);pointer-events:none}
#msg.menu .btn{pointer-events:auto}
.eyebrow{font:500 11px var(--sans);letter-spacing:4px;color:var(--acc);text-transform:uppercase;margin-bottom:10px}
#msg h1{font:600 clamp(54px,14vw,96px)/.88 var(--cond);letter-spacing:3px;margin:0 0 16px;color:var(--ink);text-transform:uppercase}
#msg h1 span{display:block;font-weight:400;letter-spacing:12px;font-size:.5em;color:var(--dim);margin-top:6px}
#msg p{margin:0;max-width:340px;font-weight:300}
#msg b{color:var(--ink);font-weight:600}
.keys{margin-top:16px;font:500 10px var(--sans);letter-spacing:2px;color:#ecebe666;text-transform:uppercase}
.card{background:var(--glass);border:1px solid var(--line);padding:26px 24px 20px;width:min(92vw,400px);backdrop-filter:blur(10px);text-align:left}
.card h2{font:600 40px/1 var(--cond);letter-spacing:2px;margin:0 0 4px;text-transform:uppercase}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 16px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats label{display:block;font:500 9px var(--sans);letter-spacing:2px;color:var(--dim);text-transform:uppercase}
.stats b{font:600 26px/1.1 var(--cond);letter-spacing:1px}
.btn{display:block;width:100%;max-width:340px;margin:8px 0 0;padding:15px 22px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:#0b0b0d;font:600 14px var(--cond);letter-spacing:3px;text-transform:uppercase;text-align:center}
.btn.alt{background:#0006;color:var(--ink);border-color:var(--line);backdrop-filter:blur(6px)}
.card .btn{max-width:none}
/* garage */
#gar{position:fixed;left:0;right:0;bottom:0;max-height:56vh;overflow:auto;background:linear-gradient(#0a0b0dcc,#0a0b0df5);border-top:1px solid var(--line);padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px));display:none;font-size:13px;backdrop-filter:blur(12px)}
body[data-st=garage] #gar{display:block}
#gar h2{margin:0 0 2px;font:600 24px var(--cond);letter-spacing:3px;text-transform:uppercase}#gar small{color:var(--dim);font-weight:300}
#gar h3{margin:14px 0 8px;font:500 10px var(--sans);letter-spacing:2.5px;text-transform:uppercase;color:var(--dim)}
.sw{width:30px;height:30px;border-radius:50%;border:1px solid #ffffff44;margin:0 8px 8px 0;padding:0;vertical-align:middle}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 3px #0a0b0d,0 0 0 4px var(--ink)}
.chip{padding:9px 16px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--dim);margin:0 6px 6px 0;font:600 13px var(--cond);letter-spacing:2px;text-transform:uppercase}
.chip.on{background:var(--ink);color:#0b0b0d;border-color:var(--ink)}
#cp{width:42px;height:30px;padding:0;border:1px solid var(--line);border-radius:2px;background:none;vertical-align:middle}
.grow{display:flex;gap:8px;margin-top:16px}.grow .btn{margin:0;flex:1;padding:13px 8px;max-width:none}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-left:2px solid var(--ok);padding:9px 18px;font:500 12px var(--sans);letter-spacing:1px;display:none;z-index:9}
#msg.maps{justify-content:flex-start;align-items:stretch;background:linear-gradient(#000c,#0008);gap:6px}
.mh2{font:600 34px/1 var(--cond);letter-spacing:2px;color:var(--ink);margin:0 0 6px;text-transform:uppercase}
.mrow{display:flex;gap:12px;overflow-x:auto;padding:6px 2px 12px;flex:1;min-height:0}
.mc{flex:0 0 210px;border:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;cursor:pointer;backdrop-filter:blur(6px)}
.mc.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.mp{flex:1;min-height:110px;position:relative}
.tg{position:absolute;left:0;top:0;background:var(--acc);color:#111;font:700 11px var(--cond);letter-spacing:2px;padding:3px 9px;text-transform:uppercase}
.mc.on .mp:after{content:'SELECTED';position:absolute;right:0;bottom:0;background:var(--ink);color:#111;font:700 10px var(--cond);letter-spacing:2px;padding:3px 9px}
.mi{padding:12px;display:flex;flex-direction:column;gap:2px}
.mi b{font:600 26px/1 var(--cond);letter-spacing:1px;color:var(--ink)}
.mi small{font:500 10px var(--sans);letter-spacing:2px;color:var(--acc);text-transform:uppercase}
.mi p{margin:6px 0;font-size:12px;line-height:1.5}
.mi em{font:500 10px var(--sans);letter-spacing:2px;color:var(--dim);font-style:normal;text-transform:uppercase}
.mb{display:flex;gap:8px}.mb .btn{margin:0;max-width:none}
</style></head><body data-st="menu">
<div id="vig"></div><div id="grain"></div><div id="red"></div><div id="spd"></div>
<div id="hud"><div id="bar"><div id="fill"></div></div>
  <div id="row"><div class="cell"><label>To safe zone</label><b id="d"></b></div>
  <div id="cmp"><div id="cmpt"></div><div id="cmpm"></div></div>
  <div class="cell r"><label>Pursuer</label><b id="gp"></b></div></div></div>
<div id="alive"></div><div id="feed"></div>
<canvas id="mm" width="224" height="224"></canvas>
<div id="dash"><div id="sv">0</div><div id="su">KM/H</div><div id="nit"><i></i><i></i><i></i></div><div id="hpw"><div id="hpf"></div></div><div id="hpt"></div></div>
<button id="nb">NITRO</button>
<div id="msg"></div>
<div id="gar"></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let GOAL=3500;const HALF=5.4,HAZE=0xcf9068;
const E=id=>document.getElementById(id);
const R=new THREE.WebGLRenderer({antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;R.outputEncoding=THREE.sRGBEncoding;
R.domElement.className='gl';document.body.prepend(R.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(HAZE,35,600);
const cam=new THREE.PerspectiveCamera(65,1,.1,1500);
function resize(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.random()*a.length|0];
function tex(w,h,fn,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t}
// ---------- sky ----------
const skyT=tex(4,512,(x,w,h)=>{const g=x.createLinearGradient(0,0,0,h);
  [[0,'#0b1330'],[.3,'#2d3f75'],[.44,'#d98a66'],[.5,'#f4bb88'],[.505,'#3a2a28'],[1,'#2a2420']].forEach(a=>g.addColorStop(a[0],a[1]));x.fillStyle=g;x.fillRect(0,0,w,h)},1,1);
const dome=new THREE.Mesh(new THREE.SphereGeometry(1200,24,16),new THREE.MeshBasicMaterial({map:skyT,side:THREE.BackSide,fog:false,depthWrite:false}));dome.renderOrder=-2;scene.add(dome);
const sunT=tex(128,128,(x,w,h)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'#fff');g.addColorStop(.15,'#fff0c0');g.addColorStop(.4,'#ffa05055');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,w,h)},1,1);
const sunS=new THREE.Sprite(new THREE.SpriteMaterial({map:sunT,blending:THREE.AdditiveBlending,fog:false,depthWrite:false}));sunS.scale.set(420,420,1);scene.add(sunS);
const cloudT=tex(128,64,(x,w,h)=>{for(let i=0;i<9;i++){const cx=rnd(25,103),cy=rnd(22,42),r=rnd(14,26),g=x.createRadialGradient(cx,cy,0,cx,cy,r);g.addColorStop(0,'rgba(255,255,255,.8)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h)}},1,1);
const clouds=[];for(let i=0;i<14;i++){const c=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudT,fog:false,depthWrite:false,transparent:true,opacity:rnd(.5,.9),color:0xffc9a2}));
  c.scale.set(rnd(250,450),rnd(70,120),1);c.userData={rx:rnd(-800,800),y:rnd(110,230),rz:rnd(-1000,-520)};scene.add(c);clouds.push(c)}
// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x9fb0e0,0x33281c,.7));
const sun=new THREE.DirectionalLight(0xffb070,1.5);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.bias=-.0004;
Object.assign(sun.shadow.camera,{left:-14,right:14,top:14,bottom:-14,near:1,far:120});scene.add(sun,sun.target);
const fill=new THREE.DirectionalLight(0x7788bb,.4);fill.position.set(0,10,30);scene.add(fill);
// ---------- ground / road ----------
const grass=tex(256,256,(x,w,h)=>{x.fillStyle='#34502a';x.fillRect(0,0,w,h);
  for(let i=0;i<6000;i++){x.fillStyle='hsla('+rnd(70,110)+','+rnd(25,45)+'%,'+rnd(12,30)+'%,.7)';x.fillRect(Math.random()*w,Math.random()*h,rnd(1,3),rnd(1,4))}
  for(let i=0;i<300;i++){x.fillStyle='rgba(90,70,50,.5)';x.fillRect(Math.random()*w,Math.random()*h,2,2)}},220,220);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(1100,1100),new THREE.MeshStandardMaterial({map:grass,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.03;ground.receiveShadow=true;scene.add(ground);
const RL=1100,REP=RL/12;
const asph=tex(256,256,(x,w,h)=>{x.fillStyle='#3a3a3d';x.fillRect(0,0,w,h);
  for(let i=0;i<14000;i++){const v=rnd(30,95)|0;x.fillStyle='rgba('+v+','+v+','+v+',.55)';x.fillRect(Math.random()*w,Math.random()*h,rnd(1,2.5),rnd(1,2.5))}
  x.fillStyle='rgba(0,0,0,.14)';x.fillRect(w*.27,0,w*.1,h);x.fillRect(w*.63,0,w*.1,h);
  x.strokeStyle='rgba(15,15,15,.5)';x.lineWidth=1;for(let i=0;i<5;i++){x.beginPath();x.moveTo(rnd(0,w),rnd(0,h));x.lineTo(rnd(0,w),rnd(0,h));x.stroke()}
  x.fillStyle='#e6e6e0';x.fillRect(w*.025,0,w*.02,h);x.fillRect(w*.955,0,w*.02,h);
  x.fillStyle='#e8c53a';x.fillRect(w*.49,0,w*.02,h*.42)},1,REP);
const road=new THREE.Mesh(new THREE.PlaneGeometry(12.4,RL),new THREE.MeshStandardMaterial({map:asph,bumpMap:asph,bumpScale:.5,roughness:.8}));
road.rotation.x=-Math.PI/2;road.receiveShadow=true;scene.add(road);
const mts=new THREE.Group();
for(let i=0;i<16;i++){const h=rnd(90,220),m=new THREE.Mesh(new THREE.ConeGeometry(rnd(90,170),h,6),new THREE.MeshStandardMaterial({color:0x3f4560,flatShading:true,roughness:1}));
  m.position.set(-800+i*105+rnd(-30,30),h/2-8,rnd(-60,0));mts.add(m)}scene.add(mts);
// ---------- roadside scenery ----------
const bark=new THREE.MeshStandardMaterial({color:0x3b2a1b,roughness:1});
const leaves=[0x173f20,0x1d5228,0x27652f].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true}));
function mkTree(){const t=new THREE.Group();const k=new THREE.Mesh(new THREE.CylinderGeometry(.25,.35,3,6),bark);k.position.y=1.5;k.castShadow=true;t.add(k);
  [[2.3,5,4.5],[1.8,4,6.8],[1.2,3,8.8]].forEach((a,i)=>{const c=new THREE.Mesh(new THREE.ConeGeometry(a[0],a[1],7),leaves[i]);c.position.y=a[2];c.castShadow=true;t.add(c)});
  t.scale.setScalar(rnd(.8,1.7));return t}
const TN=70,trees=[];
for(let i=0;i<TN;i++){const t=mkTree(),s=i%2?1:-1;t.userData.x=s*rnd(8,40);t.userData.z0=-(i>>1)*14-rnd(0,8);t.position.set(t.userData.x,0,t.userData.z0);t.rotation.y=rnd(0,6);scene.add(t);trees.push(t)}
const poleM=new THREE.MeshStandardMaterial({color:0xeeeeee,emissive:0x555555,roughness:.5}),poles=[];
for(let i=0;i<50;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.12,1.1,.12),poleM);p.position.set(i%2?6.8:-6.8,.55,-(i>>1)*10);p.userData.z0=p.position.z;scene.add(p);poles.push(p)}
const railM=new THREE.MeshStandardMaterial({color:0xb8bcc2,roughness:.35,metalness:.9}),postM=new THREE.MeshStandardMaterial({color:0x55565a,roughness:.7,metalness:.4}),rails=[];
for(let i=0;i<42;i++)[-1,1].forEach(s=>{const g=new THREE.Group();
  const beam=new THREE.Mesh(new THREE.BoxGeometry(.1,.32,11.8),railM);beam.position.y=.62;beam.castShadow=true;g.add(beam);
  const post=new THREE.Mesh(new THREE.BoxGeometry(.12,.7,.12),postM);post.position.set(0,.35,0);g.add(post);
  g.position.set(s*7.5,0,-i*12);g.userData.z0=g.position.z;scene.add(g);rails.push(g)});
const bushM=[0x25421f,0x2f5a26].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true})),bushes=[];
for(let i=0;i<60;i++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry(1,0),bushM[i%2]),s=rnd(.5,1.2);b.scale.set(s*rnd(1,1.6),s*.7,s);
  b.userData.x=(i%2?1:-1)*rnd(8.5,20);b.userData.z0=-i*7.4;b.position.set(b.userData.x,.4*s,b.userData.z0);b.castShadow=true;b.rotation.y=rnd(0,6);scene.add(b);bushes.push(b)}
const DN=260,dgeo=new THREE.BufferGeometry(),dpos=new Float32Array(DN*3);
for(let i=0;i<DN;i++){dpos[i*3]=rnd(-18,18);dpos[i*3+1]=rnd(.2,7);dpos[i*3+2]=rnd(-70,10)}
dgeo.setAttribute('position',new THREE.BufferAttribute(dpos,3));
const dust=new THREE.Points(dgeo,new THREE.PointsMaterial({size:.14,color:0xffddb0,transparent:true,opacity:.5,depthWrite:false}));dust.frustumCulled=false;scene.add(dust);
const puffT=tex(64,64,(x,w,h)=>{const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,w,h)},1,1);
const puffs=[];for(let i=0;i<28;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:puffT,transparent:true,opacity:0,depthWrite:false}));s.visible=false;s.userData={life:0,max:1};scene.add(s);puffs.push(s)}
let pIdx=0,pTimer=0;
function emit(dt,off){pTimer-=dt;if(pTimer>0)return;pTimer=off?.03:.05;const s=puffs[pIdx++%puffs.length];
  s.position.set(S.x+(off?rnd(-.4,.4):.3),off?.2:.35,S.z+1.2);
  s.material.color.set(S.boost>0&&!off?0x66aaff:off?0x8a7050:0xb0b0b0);

  if(off){v*=.7;S.shake=.1}
  S.v=v;S.z-=v*dt;
  S.chx+=(S.x-S.chx)*dt*2.5;
  const ch=38+(-S.z)*.0065;
  S.gap=Math.min(100,S.gap+(v-ch)*dt*.6);
  if(S.shake>0)S.shake-=dt;if(S.hit>0)S.hit-=dt;

    cam.position.set(S.x*.7+sh,3.6,z+9.5);cam.lookAt(S.x*.4,1.5,z-14);cam.rotateZ(-S.lean*.1);
    cam.fov+=((S.boost>0?84:65)-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix()}
  // HUD
  if(st==='play'){
    E('fill').style.width=Math.min(100,(-z)/GOAL*100)+'%';
    E('d').textContent=Math.max(0,Math.round(GOAL+z))+' m';
    E('gp').textContent=Math.max(0,Math.round(S.gap))+' m';E('gp').style.color=S.gap<20?'var(--bad)':'';
    E('sv').textContent=Math.round(S.v*3.6);
    for(let i=0;i<3;i++)nitI[i].className=i<S.nitro?'on':'';
    E('alive').innerHTML='Alive<b>'+aliveN()+'</b>';
    const hp=Math.max(0,S.hp);E('hpf').style.width=hp+'%';E('hpf').style.background=hp>50?'#ecebe6':hp>25?'#d9a441':'#d4443a';E('hpt').textContent='HEALTH  '+Math.round(hp);
    E('cmpt').style.transform='translateX('+(-S.lean*35*2)+'px)';
    redF.style.opacity=Math.max(S.hit>0?S.hit*1.6:0,S.gap<22?(1-S.gap/22)*(.6+.4*Math.sin(S.t*14)):0);
    spdF.style.opacity=Math.min(.45,Math.max(0,(S.v-45)/70)+(S.boost>0?.2:0));
    drawMM();
  }else redF.style.opacity=0;
  R.render(scene,cam);
}
let last=0;(function frame(t){requestAnimationFrame(frame);const dt=Math.min(.05,(t-last)/1000||0);last=t;step(dt);render(dt)})(0);
</script></body></html>
